name: grow-my-money

services:
  app:
    image: ericfaris/grow-my-money:latest
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    # NOTE: no `ports:` — this bot serves nothing.
    env_file:
      - .env
    environment:
      # Only NON-SECRET tunables ride the env-passthrough path. The Coinbase key
      # and the SMTP password come ONLY from the :ro mounts below, never here.
      COINBASE_KEY_FILE: /run/secrets/coinbase.key
      SMTP_CREDS_FILE: /run/secrets/smtp.env
    volumes:
      # Persistent, bind-mounted state (SQLite db, model pickle, KILL sentinel).
      - ./state:/app/state
      # Out-of-repo credentials, read-only, never baked into the image.
      - ${HOME}/.config/coinbase/grow-my-money.key:/run/secrets/coinbase.key:ro
      - ${HOME}/.config/coinbase/grow-my-money.smtp:/run/secrets/smtp.env:ro
